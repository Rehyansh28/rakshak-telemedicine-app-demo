services:
  backend:
    build: ./backend
    ports:
      - "8555:8555"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-sachin.software}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5555:5555"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:8555
      - VITE_TUNNEL_DOMAIN=${PUBLIC_DOMAIN:-sachin.software}
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  frontend_node_modules:
