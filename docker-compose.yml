services:
  backend:
    build: ./backend
    ports:
      - "8555:8555"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5555:5555"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:8555
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
