<!-- Interactive script for ambient motion -->
<script>
        document.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const mouseX = e.clientX - centerX;
            const mouseY = e.clientY - centerY;
            
            // Subtle parallax for cards
            const panels = document.querySelectorAll('.glass-panel');
            panels.forEach((panel, index) => {
                const depth = (index + 1) * 15;
                const moveX = mouseX / depth;
                const moveY = mouseY / depth;
                panel.style.transform = `translate(${moveX}px, ${moveY}px) ${panel.classList.contains('rotate-2') ? 'rotate(2deg)' : 'rotate(-3deg)'}`;
            });
        });

        // Background grid interaction
        const grid = document.querySelector('.hud-grid');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            grid.style.background = `radial-gradient(circle at ${x}% ${y}%, rgba(0, 238, 252, 0.08) 0%, transparent 60%), radial-gradient(circle, rgba(0, 238, 252, 0.05) 1px, transparent 1px)`;
            grid.style.backgroundSize = `100% 100%, 32px 32px`;
        });
