# Rakshak hub settings.
# Lines starting with # are comments. After changing a value, stop the hub
# (Ctrl+C) and start it again.
# EXPERIMENTAL student prototype - these thresholds are NOT medically validated.

[serial]
# "auto" = find the ESP32 by itself. Or write the port name, for example
#   macOS:   /dev/cu.usbserial-0001   (list them with: python hub.py ports)
#   Windows: COM3
#   Linux / Raspberry Pi: /dev/ttyUSB0
port = auto
baud = 921600
# Seconds to wait between reconnect attempts when the USB cable is unplugged.
reconnect_interval_s = 2

[devices]
# Which soldier wears which ESP32:   <dev name sent by the ESP32> = <soldier ID in the app>
# See the soldier IDs in Super Admin -> Soldiers, or open
# http://127.0.0.1:8555/api/patients/ in a browser (the "id" field).
node-01 = IA-SLD-1923

[timeouts]
# The sensor counts as "disconnected" when no message arrives for this long.
disconnect_after_s = 3
# One sensor type (ECG or IMU) counts as "stopped" when its messages are missing this long.
stale_after_s = 2

[ecg]
# Electrodes must be off this long before an alert is raised (ignores short wiggles).
leads_off_alert_after_s = 3
# Heart rates outside this range are treated as "unknown" (probably noise).
hr_min_valid = 25
hr_max_valid = 250

# --- Signal quality (checked by the hub on the raw samples) ---
# A good ECG sits around 2000 with heartbeats on top. Some faults (e.g. the AD8232
# losing power) still say "electrodes on", so the hub also checks the signal itself.
# Length of recent signal that is judged (seconds).
signal_window_s = 2
# "Flat" (no heartbeat) when the signal moves less than this (raw ADC counts).
flat_range_counts = 80
# Samples closer than this to 0 or 4095 count as "near the end of the range" ...
rail_margin_counts = 300
# ... and the signal is bad when more than this share of samples is near the ends.
max_near_rail_fraction = 0.5
# Bad when more than this share of samples actually hits 0 or 4095 (clipping).
max_clipped_fraction = 0.1
# Alert "ECG signal poor" when it stays bad this long.
poor_signal_alert_after_s = 3
# After a bad signal, trust the ESP32's heart rate again only after this long.
hr_settle_s = 3

[imu]
# --- Calibration ("this is upright") ---
# The person stands still this long; that direction becomes "upright".
calibrate_seconds = 3
# How still is "still" while calibrating (spread of total acceleration, in g).
calibrate_max_accel_std_g = 0.03
# Print a warning if calibration has not finished after this long.
calibrate_timeout_s = 20

# Which IMU axis points OUT of the chest (away from the skin). Used only to tell
# lying on the back / front / side apart. Use +z if the chip faces away from the
# body, -z if it faces the skin.
chest_normal_axis = +z

# --- Posture ---
# Smoothing of the gravity direction (seconds). Bigger = calmer but slower.
gravity_filter_s = 0.5
# Tilt from the calibrated upright direction, in degrees:
#   below upright_max_deg = upright, above lying_min_deg = lying, in between = leaning
upright_max_deg = 35
lying_min_deg = 60
# A new posture must hold this long before we switch to it.
posture_hold_s = 1.0

# --- Activity (still / moving) ---
# Window of recent samples used to judge movement (seconds).
activity_window_s = 1.5
# "Moving" when the spread of total acceleration is above this (g) ...
moving_accel_std_g = 0.05
# ... or when the average rotation speed is above this (degrees per second).
moving_gyro_dps = 25

# --- Fall detection ---
# An impact of at least this much total acceleration (g), followed by lying down.
# NOTE: if the IMU is set to a +-2 g range in the firmware it can never read above
# 2 g - then use 1.9 here.
fall_impact_g = 2.0
# Also require a short "free fall" (near 0 g) just before the impact? (yes / no)
fall_require_freefall = no
freefall_g = 0.5
freefall_window_s = 1.0
# How long after the impact we check that the person is lying.
fall_confirm_s = 2.0
# Minimum time between two fall alerts.
fall_cooldown_s = 30

# --- No movement (possible unconscious) ---
# Alert when there has been no movement for this long (seconds).
no_movement_alert_after_s = 30
# Only count the time while the person is lying down? (yes / no)
no_movement_only_when_lying = yes

[hub]
# How often (seconds) a summary is made (printed, and sent to Django).
summary_interval_s = 1

[live]
# Stream live data (ECG graph, heart rate, posture, alerts) to the web app? (yes / no)
# The app reaches it at /live through the Vite dev server (see frontend/vite.config.js).
enabled = yes
# 127.0.0.1 = only this computer. Use 0.0.0.0 on the Raspberry Pi so the laptop can reach it.
host = 127.0.0.1
port = 8765

[backend]
# Send the summaries (heart rate, posture... once per second) and alerts to Django? (yes / no)
# The raw ECG waveform is never sent to Django.
enabled = yes
url = http://127.0.0.1:8555/api
send_interval_s = 1
# The hub logs in with a Medical Staff account. Put its username and password in the
# file hub/.env (copy .env.example to .env) - NOT in this file, so they stay out of git.
